name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build project
        run: ./dev/build.sh --no-install

      - name: Locate release asset
        id: asset
        run: |
          asset_path=$(find build -maxdepth 1 -type f -name '*.op' | head -n 1)
          if [ -z "$asset_path" ]; then
            echo "No .op build artifact found in build/" >&2
            exit 1
          fi
          echo "asset_path=$asset_path" >> $GITHUB_OUTPUT
          echo "asset_name=$(basename "$asset_path")" >> $GITHUB_OUTPUT

      - name: Read release notes from CHANGELOG
        id: changelog
        run: |
          set -e
          tag=${GITHUB_REF_NAME}
          section=$(grep -nE "^## \[?${tag}\]?" CHANGELOG.md | cut -d: -f1 | head -n1 || true)
          if [ -n "$section" ]; then
            start=$((section + 1))
            next_section_line=$(tail -n +$start CHANGELOG.md | grep -nE '^## ' | head -n1 | cut -d: -f1 || true)
            if [ -n "$next_section_line" ]; then
              end=$((start + next_section_line - 2))
            else
              end=$(wc -l < CHANGELOG.md)
            fi
            release_notes=$(sed -n "${start},${end}p" CHANGELOG.md)
          else
            release_notes=$(cat CHANGELOG.md)
          fi
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$release_notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release and upload asset
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release_notes }}
          artifacts: ${{ steps.asset.outputs.asset_path }}
